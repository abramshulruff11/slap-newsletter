<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SLAP Meme Library Review</title>
<style>
  :root {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --border: #dcd8ce;
    --text: #1f1c16;
    --muted: #6b6558;
    --accent: #c1440e;
    --accent-soft: #f5e2d8;
    --ok: #2f6b3a;
    --ok-bg: #e6f0e4;
    --ok-border: #a8c9a2;
    --bad: #a13b3b;
    --bad-bg: #f8e6e6;
    --bad-border: #dda9a9;
    --candidate: #a5752b;
    --candidate-bg: #fbeed7;
    --special-bg: #fff4e0;
    --special-border: #e8c07a;
    --warn-bg: #fdf2d8;
    --warn-border: #dfb54e;
    --engine-bg: #e9edf5;
    --engine-border: #b6c2d8;
    --engine-text: #33456b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  code, .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
  header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header h1 { margin: 0 0 6px; font-size: 1.35rem; }
  header p.blurb { margin: 0; color: var(--muted); font-size: 0.88rem; max-width: 90ch; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    padding: 6px 14px;
    font-size: 0.85rem;
    border-radius: 7px 7px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
  }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .controls input[type="text"] {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.85rem; min-width: 200px; background: var(--bg); color: var(--text);
  }
  select {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.85rem; background: var(--bg); color: var(--text);
  }
  .count { margin-left: auto; font-size: 0.85rem; color: var(--muted); }
  main { max-width: 1500px; margin: 0 auto; padding: 20px 24px 60px; }

  .engines { margin-bottom: 22px; display: flex; flex-direction: column; gap: 12px; }
  .engine-card {
    background: var(--engine-bg);
    border: 1px solid var(--engine-border);
    border-left: 4px solid var(--engine-text);
    border-radius: 8px;
    padding: 13px 16px;
  }
  .engine-card h3 {
    margin: 0 0 6px; font-size: 0.95rem; color: var(--engine-text);
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
  }
  .engine-card .row { font-size: 0.83rem; line-height: 1.45; margin-bottom: 4px; }
  .engine-card .row b {
    color: var(--engine-text); text-transform: uppercase; font-size: 0.66rem;
    letter-spacing: 0.04em; display: inline-block; min-width: 108px; vertical-align: top;
  }
  .engine-card .members { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
  .engine-card .members span {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 999px;
    background: #fff; border: 1px solid var(--engine-border); color: var(--engine-text);
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
  }

  .open-qs {
    background: var(--warn-bg); border: 1px solid var(--warn-border);
    border-radius: 8px; padding: 12px 16px 12px 18px; margin-bottom: 22px;
  }
  .open-qs h3 { margin: 0 0 6px; font-size: 0.9rem; color: #7a5b12; }
  .open-qs ol { margin: 0; padding-left: 20px; font-size: 0.83rem; line-height: 1.5; }
  .open-qs li { margin-bottom: 5px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 18px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  }
  .card-img {
    width: 100%; height: 230px; background: #efece4;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .card-img .broken { font-size: 0.75rem; color: var(--muted); padding: 10px; text-align: center; }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 9px; }
  .card-title h2 { margin: 0; font-size: 1.02rem; font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 0.67rem; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap;
  }
  .badge.status { background: var(--candidate-bg); color: var(--candidate); }
  .badge.pattern { background: #e4e8f0; color: #33456b; }
  .badge.engine {
    background: var(--engine-text); color: #fff;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 0.64rem;
  }

  .subject {
    background: #f3f0ff; border: 1px solid #cdc2ee; border-radius: 6px;
    padding: 8px 10px; font-size: 0.81rem; line-height: 1.4;
  }
  .subject .label, .valence .label, .engine-line .label {
    font-weight: 700; text-transform: uppercase; font-size: 0.66rem;
    letter-spacing: 0.04em; display: block; margin-bottom: 3px;
  }
  .subject .label { color: #5b48a8; }
  .subject .placement {
    display: inline-block; font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 0.72rem; background: #fff; border: 1px solid #cdc2ee;
    border-radius: 4px; padding: 1px 6px; margin-top: 4px; color: #5b48a8;
  }
  .engine-line { font-size: 0.83rem; line-height: 1.45; }
  .engine-line .label { color: var(--engine-text); }
  .valence {
    background: #fff8ec; border: 1px solid var(--special-border);
    border-left: 3px solid #c98b1e; border-radius: 6px;
    padding: 8px 10px; font-size: 0.81rem; line-height: 1.45;
  }
  .valence .label { color: #8a5a00; }

  .boxes { margin: 0; padding-left: 18px; font-size: 0.82rem; }
  .boxes li { margin-bottom: 4px; }
  .boxes li b { color: var(--muted); font-weight: 600; }
  .boxes .vnote { color: var(--muted); font-style: italic; font-size: 0.76rem; display: block; }

  .field { font-size: 0.83rem; line-height: 1.42; }
  .field .label {
    font-weight: 700; color: var(--muted); text-transform: uppercase;
    font-size: 0.66rem; letter-spacing: 0.04em; display: block; margin-bottom: 2px;
  }
  .field.use .label { color: var(--ok); }
  .field.dont .label { color: var(--accent); }

  .examples { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  @media (max-width: 620px) { .examples { grid-template-columns: 1fr; } }
  .ex { border-radius: 6px; padding: 9px 10px; font-size: 0.79rem; line-height: 1.4; }
  .ex.good { background: var(--ok-bg); border: 1px solid var(--ok-border); }
  .ex.bad  { background: var(--bad-bg); border: 1px solid var(--bad-border); }
  .ex .label {
    font-weight: 700; text-transform: uppercase; font-size: 0.65rem;
    letter-spacing: 0.04em; display: block; margin-bottom: 5px;
  }
  .ex.good .label { color: var(--ok); }
  .ex.bad .label { color: var(--bad); }
  .ex .subj { font-size: 0.72rem; color: var(--muted); margin-bottom: 5px; }
  .ex ol { margin: 0 0 6px; padding-left: 17px; }
  .ex ol li {
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 0.72rem; margin-bottom: 2px; letter-spacing: 0.01em;
  }
  .ex .why { font-style: italic; color: #4a4438; }
  .ex .timing { margin-top: 5px; font-size: 0.72rem; color: var(--muted); }

  .special, .conflict, .contrast {
    border-radius: 6px; padding: 8px 10px; font-size: 0.79rem; line-height: 1.4;
  }
  .special { background: var(--special-bg); border: 1px solid var(--special-border); }
  .conflict { background: var(--warn-bg); border: 1px solid var(--warn-border); }
  .contrast { background: #eef1f6; border: 1px dashed var(--engine-border); color: var(--engine-text); }
  .special .label, .conflict .label, .contrast .label {
    font-weight: 700; text-transform: uppercase; font-size: 0.65rem;
    letter-spacing: 0.04em; display: block; margin-bottom: 3px;
  }
  .special .label { color: #8a5a00; }
  .conflict .label { color: #8a6410; }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 0.67rem; padding: 2px 7px; border-radius: 5px; background: #eeece4; color: var(--muted); }
  .review { display: flex; gap: 6px; margin-top: 4px; border-top: 1px solid var(--border); padding-top: 10px; }
  .review button {
    flex: 1; padding: 6px 4px; font-size: 0.75rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;
  }
  .review button.active-good { background: #d9ecd8; border-color: var(--ok); color: var(--ok); }
  .review button.active-fix { background: #f6dede; border-color: var(--bad); color: var(--bad); }
  .card.marked-good { outline: 2px solid var(--ok); }
  .card.marked-fix { outline: 2px solid var(--bad); }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; padding: 10px 24px 30px; }
  .no-results { color: var(--muted); padding: 40px; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <h1>SLAP Meme Library Review</h1>
  <p class="blurb" id="blurb"></p>
  <div class="controls">
    <input type="text" id="search" placeholder="Search slug, purpose, tags…">
    <select id="categoryFilter"><option value="">All categories</option></select>
    <select id="patternFilter"><option value="">All pattern types</option></select>
    <select id="reviewFilter">
      <option value="">All review states</option>
      <option value="good">Marked good</option>
      <option value="fix">Marked needs fix</option>
      <option value="unmarked">Unmarked</option>
    </select>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <div class="engines" id="engines"></div>
  <div class="open-qs" id="openQs" style="display:none"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Marks are stored in this browser only (localStorage), per dataset — not saved back to the JSON files. Example captions are illustrative shape demos, never factual claims.</footer>
<script>
const DATASETS = {"v2": {"label": "Full library (30)", "blurb": "All 30 templates in the extended schema \u2014 engine, mandatory subject, valence rule, worked vs anti example. Every entry is status: candidate, awaiting your review.", "meta": {"purpose": "Box-semantics + comedic-engine library for SLAP's meme templates. For each template in generate_memes.py's CURATED_TEMPLATES this documents WHO the meme is about (subject), WHERE the laugh comes from (engine + comedic_engine), the REQUIRED relationship between caption boxes (valence), and a worked/anti example pair. Replaces the mechanics-only v1.", "consumption_model": "Two projections are derived from this file. (1) prompts/meme_selector_index.txt -- a compact one-line-per-template index for PASS 1, which already seeds meme_concept and is the natural place to pick the template slug. (2) The full entry for the 1-2 selected templates only, injected into PASS 2 for caption writing. The whole file is NOT injected wholesale -- at ~30 full entries that is roughly 23k tokens competing with voice_examples.txt for the writer's attention.", "source_of_truth": "template_id values are INHERITED from CURATED_TEMPLATES in generate_memes.py and are trusted there (several carry '# FIXED: was X' history). They are NOT re-derived here and MUST stay in sync.", "status_field": "'status' tracks review state of the SEMANTICS ONLY -- not the template_id. Every entry is 'candidate' (AI-authored, awaiting review). No 'verified' tier exists yet.", "subject_is_mandatory": "Every template requires a subject -- the person/team/org the meme is about. subject.placement is either 'box:N' (a caption box names them) or 'copy' (the surrounding prose must). Where placement is 'copy', subject.rule is a HARD requirement: the subject must be named in the sentence immediately before or after the meme, and if no specific subject can be named the template must not be used. ENFORCEMENT GAP: pass2_writer.txt does not currently carry this rule and nothing validates it. See open_questions_for_review.", "engine_axis": "'engine' is the shared comedic mechanism -- templates in one engine share comedic_engine, valence_rule, key_test and failure_mode (defined once under _meta.engines). 'pattern_type' is the separate structural axis: how captions map onto physical panels. Two templates can share an engine but differ in pattern_type (drake vs distracted-boyfriend) or vice versa. The taxonomy is open -- add a new engine rather than force a bad fit.", "examples_are_illustrative": "worked_example and anti_example captions demonstrate SHAPE ONLY. They are NOT factual claims and must never be reused as source material. Real captions must be built from game_state.json ground truth.", "box_count_convention": "box_count is the number of PHYSICAL panels the template renders, which may exceed the captions a writer supplies (gru-plan renders 4 from 3; anakin-padme renders 4 from 2). See special_handling.", "open_questions_for_review": ["SUBJECT ENFORCEMENT (biggest): subject.placement 'copy' is a hard rule in this file, but pass2_writer.txt has no matching rule and pre_edit() does not check it. Options: (a) add the rule to pass2_writer.txt and mirror it like the banned-phrase sync, (b) add data-subject to the meme-placeholder div so pre_edit() can verify the subject appears in the section text -- makes it machine-checkable but needs a generate_memes.py change.", "distracted-boyfriend box_count: documented as 3 with the subject in box 2, but meme_reference.txt says 2 panels and _expand_boxes() has no case for it, so the subject panel may render uncaptioned today. Needs verification against a real render; likely a code + reference fix.", "PRUNING: all 30 are documented as requested. Weakest sports fits, flagged for possible removal: epic-handshake (its shared thing has no caption box, so it leans entirely on the copy), is-this-a-pigeon (needs a confidently-wrong public claim, which is rare), one-does-not-simply (the assumed-easy/actually-hard gap is narrow).", "Where does this land first -- uat/prompts/ or prod prompts/? CLAUDE.md says UAT before prod, promotion manual."], "engines": {"subject_abandons_sensible_for_funky": {"summary": "A named subject faces an obviously correct option and visibly goes with the worse, pettier, or stranger one.", "comedic_engine": "The laugh is not the comparison -- it is that a real, named person actually chose the dumb thing while the audience can plainly see the right answer.", "valence_rule": "The abandoned option MUST be genuinely appealing or rational. The chosen option MUST be petty, self-defeating, or conspicuously odd. NEVER write the chosen option as the smarter one.", "key_test": "The choice is ALREADY MADE and public. We are reacting to it, not predicting it.", "failure_mode": "The straight upgrade: both options ranked with the second genuinely better. Produces an earnest endorsement or an ad, with zero comedy.", "members": ["drake", "distracted-boyfriend", "left-exit-12-off-ramp"]}, "self_inflicted_realization": {"summary": "The subject caused their own problem, and the reveal -- them realizing it, or conspicuously not -- is the punchline.", "comedic_engine": "Dramatic irony collapsing. The audience saw it coming; the subject is only now arriving, or is still pretending not to have arrived.", "valence_rule": "The damage MUST be traceable to the subject's own action. If an outside force caused it, this engine does not apply -- that is bad luck, not self-sabotage.", "key_test": "Could the subject have avoided this by not doing the thing they did? If no, wrong engine.", "failure_mode": "Blaming an external party. The moment someone else is at fault the joke evaporates.", "members": ["gru-plan", "clown-applying-makeup", "eric-andre-shooting"]}, "never_arrives": {"summary": "Something awaited -- an answer, a concession, an event -- never materializes, and the waiting itself becomes the joke.", "comedic_engine": "The gap between how reasonable the request is and how completely it goes unanswered. Repetition or decay stands in for the silence.", "valence_rule": "The awaited thing MUST be reasonable to want. If it is absurd to expect, the joke becomes mockery of the asker instead of the withholder.", "key_test": "Is the subject still waiting/asking as of today? If it already resolved, do not use this engine.", "failure_mode": "Using it for something that actually did arrive, which drains all the futility.", "members": ["anakin-padme", "bernie-i-am-once-again-asking", "waiting-skeleton"]}, "obliviousness_gap": {"summary": "The subject's grasp of reality is comically out of step with what the audience can plainly see.", "comedic_engine": "The audience is ahead of the subject. Either the subject is stunned by something inevitable, is only now noticing what was always true, or is confidently wrong.", "valence_rule": "The truth MUST be genuinely obvious to the audience. If the audience is also surprised, there is no gap and nothing to laugh at.", "key_test": "Would a casual fan have seen this coming? If not, the subject is not oblivious -- they are just informed.", "failure_mode": "Applying it to a genuine surprise, which makes the subject look reasonable and the meme look mean.", "members": ["surprised-pikachu", "always-has-been", "is-this-a-pigeon"]}, "escalating_ladder": {"summary": "An ordered sequence of rungs, each more extreme than the last, ending somewhere absurd.", "comedic_engine": "The final rung. Rungs 1-3 build a credible pattern so the last one can break it -- either by going too far or by being ironically dumber than rung 1.", "valence_rule": "Rungs MUST escalate monotonically on ONE axis (sophistication, hype, absurdity). A rung that plateaus or reverses kills the build.", "key_test": "Are there genuinely FOUR distinct rungs? Two beats is a comparison -- use drake instead.", "failure_mode": "Four restatements of the same idea, which reads as padding rather than escalation.", "members": ["expanding-brain", "vince-mcmahon-reaction"]}, "denial_amid_disaster": {"summary": "The subject presents calm or contentment while something is visibly going wrong.", "comedic_engine": "The gap between the composed face and the burning room. The insistence is what is funny, not the disaster.", "valence_rule": "The disaster MUST be real and visible, and the subject MUST be performing okayness about it. If they admit the problem, the engine collapses.", "key_test": "Is the subject claiming things are fine? If they are openly panicking, use a panic template instead.", "failure_mode": "Writing the subject as visibly upset, which removes the denial the whole template runs on.", "members": ["this-is-fine", "hide-the-pain-harold"]}, "contempt_face_off": {"summary": "Two parties, one of them dismissive, mocking, or utterly unbothered by the other.", "comedic_engine": "The asymmetry of energy. One side is invested; the other cannot be bothered, and that imbalance is the joke.", "valence_rule": "The two sides MUST have mismatched energy -- one heated, one contemptuous or serene. Two equally angry parties is a fight, not this.", "key_test": "Is one side clearly not taking the other seriously?", "failure_mode": "Writing both sides at equal intensity, which flattens it into a generic argument.", "members": ["mocking-spongebob", "woman-yelling-at-cat"]}, "awkward_exit_or_evasion": {"summary": "The subject wants out of a situation -- either glancing away guiltily or actually leaving.", "comedic_engine": "The physical comedy of retreat. The subject has decided this is not their problem and is visibly withdrawing.", "valence_rule": "The situation MUST be one the subject has some stake in. Withdrawing from something irrelevant is not funny -- the stake is what makes the exit cowardly.", "key_test": "Does the subject have a reason to stay? If not, leaving is just sensible.", "failure_mode": "No implicated subject, leaving the exit unmotivated.", "members": ["monkey-puppet", "ight-imma-head-out"]}, "they_are_the_same": {"summary": "Two things presented or behaving as distinct turn out to be functionally identical.", "comedic_engine": "The reveal of hidden sameness -- either a false distinction being sold, or two rivals who are mirror images while accusing each other.", "valence_rule": "The two things MUST be genuinely equivalent in the way that matters. If a real difference exists, the joke is simply wrong.", "key_test": "Could you swap the two and have nothing meaningfully change?", "failure_mode": "Forcing sameness onto things that are actually different, which reads as a bad take rather than a joke.", "members": ["corporates-want-you-to-find-the-difference", "spider-man-pointing-at-spider-man"]}, "hardened_vs_soft": {"summary": "A lopsided contrast between a hardened, battle-worn party and a soft, shocked, or diminished one.", "comedic_engine": "The veteran's indifference. What devastates one side is routine to the other, and that asymmetry of suffering is the joke.", "valence_rule": "The hardened side MUST be unimpressed BECAUSE of accumulated experience. If they are unimpressed for no reason, it is just rudeness.", "key_test": "Has the hardened side plainly been through worse?", "failure_mode": "Two parties with equivalent experience, which erases the gap the template needs.", "members": ["buff-doge-vs-cheems", "first-time"]}, "forced_choice_dilemma": {"summary": "A subject frozen between two options of the SAME valence -- both appealing, or both painful -- that cannot coexist.", "comedic_engine": "The paralysis is the joke, not the options. Either the audience finds the answer obvious and the subject clearly does not, or the two buttons expose a hypocrisy the subject created themselves.", "valence_rule": "The two options MUST be same-valence and genuinely in conflict. If one is clearly better there is no sweat and the meme dies.", "key_test": "The choice is NOT yet made -- the subject is still sweating. If it is made, use subject_abandons_sensible_for_funky.", "fai       (data.data.memes || []).forEach(m => { IMG_MAP[String(m.id)] = m.url; });
    }
  } catch (e) { /* fall back to links */ }
}

function buildTabs() {
  tabsEl.innerHTML = '';
  Object.keys(DATASETS).forEach(key => {
    const b = document.createElement('button');
    b.textContent = DATASETS[key].label;
    if (key === activeKey) b.classList.add('active');
    b.addEventListener('click', () => { activeKey = key; onDatasetChange(); });
    tabsEl.appendChild(b);
  });
}

function rebuildFilters() {
  const ts = DATASETS[activeKey].templates;
  const fill = (el, vals, allLabel) => {
    el.innerHTML = `<option value="">${allLabel}</option>`;
    [...new Set(vals)].sort().forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      el.appendChild(o);
    });
  };
  fill(catEl, ts.map(t => t.category), 'All categories');
  fill(patEl, ts.map(t => t.pattern_type), 'All pattern types');
}

function renderEngines() {
  const meta = DATASETS[activeKey].meta;
  const engines = meta.engines;
  enginesEl.innerHTML = '';
  if (!engines) return;
  Object.keys(engines).forEach(name => {
    const e = engines[name];
    const div = document.createElement('div');
    div.className = 'engine-card';
    div.innerHTML = `
      <h3>engine: ${escapeHtml(name)}</h3>
      <div class="row"><b>Summary</b> ${escapeHtml(e.summary)}</div>
      <div class="row"><b>Laugh comes from</b> ${escapeHtml(e.comedic_engine)}</div>
      <div class="row"><b>Valence rule</b> ${escapeHtml(e.valence_rule)}</div>
      <div class="row"><b>Choice state</b> ${escapeHtml(e.choice_state)}</div>
      <div class="row"><b>Fails when</b> ${escapeHtml(e.failure_mode)}</div>
      <div class="members">${(e.members || []).map(m => `<span>${escapeHtml(m)}</span>`).join('')}</div>
    `;
    enginesEl.appendChild(div);
  });
}

function renderOpenQs() {
  const meta = DATASETS[activeKey].meta;
  const qs = meta.open_questions_for_review;
  if (!qs || !qs.length) { openQsEl.style.display = 'none'; return; }
  openQsEl.style.display = '';
  openQsEl.innerHTML = `<h3>Open questions for review</h3><ol>${
    qs.map(q => `<li>${escapeHtml(q)}</li>`).join('')
  }</ol>`;
}

function exampleHtml(ex, kind) {
  if (!ex) return '';
  const isGood = kind === 'good';
  const boxes = (ex.boxes || []).map(b => `<li>${escapeHtml(b)}</li>`).join('');
  return `<div class="ex ${isGood ? 'good' : 'bad'}">
    <span class="label">${isGood ? '\u2713 Worked example' : '\u2715 Anti-example'}</span>
    ${ex.subject ? `<div class="subj">Subject: <b>${escapeHtml(ex.subject)}</b></div>` : ''}
    <ol>${boxes}</ol>
    <div class="why">${escapeHtml(ex.why_it_lands || ex.why_it_fails || '')}</div>
    ${ex.timing ? `<div class="timing">Timing: ${escapeHtml(ex.timing)}</div>` : ''}
  </div>`;
}

function render() {
  const ds = DATASETS[activeKey];
  const q = searchEl.value.trim().toLowerCase();
  const cat = catEl.value, pat = patEl.value, rev = revEl.value;

  const filtered = ds.templates.filter(t => {
    if (cat && t.category !== cat) return false;
    if (pat && t.pattern_type !== pat) return false;
    const mark = marks[markKey(t.slug)] || '';
    if (rev === 'good' && mark !== 'good') return false;
    if (rev === 'fix' && mark !== 'fix') return false;
    if (rev === 'unmarked' && mark) return false;
    if (q) {
      const hay = [
        t.slug, t.category, t.pattern_type, t.engine, t.use_when, t.do_not_use_when,
        t.comedic_engine, t.valence, ...(t.tags || []),
        ...(t.boxes || []).map(b => b.purpose)
      ].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  countEl.textContent = `${filtered.length} / ${ds.templates.length} templates`;
  grid.innerHTML = '';
  if (!filtered.length) { grid.innerHTML = '<div class="no-results">No templates match.</div>'; return; }

  filtered.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card';
    const mark = marks[markKey(t.slug)];
    if (mark === 'good') card.classList.add('marked-good');
    if (mark === 'fix') card.classList.add('marked-fix');

    const boxesHtml = (t.boxes || []).map(b =>
      `<li><b>Box ${b.index}:</b> ${escapeHtml(b.purpose)}` +
      (b.valence ? `<span class="vnote">valence: ${escapeHtml(b.valence)}</span>` : '') + `</li>`
    ).join('');

    const matchedUrl = IMG_MAP[String(t.template_id)];
    const imgHtml = matchedUrl
      ? `<img src="${escapeHtml(matchedUrl)}" alt="${escapeHtml(t.slug)}" loading="lazy"
             data-template-id="${escapeHtml(t.template_id)}" onerror="handleImgError(this)">`
      : fallbackLinkHtml(t.template_id);

    card.innerHTML = `
      <div class="card-img">${imgHtml}</div>
      <div class="card-body">
        <div class="card-title"><h2>${escapeHtml(t.slug)}</h2></div>
        <div class="badges">
          <span class="badge status">${escapeHtml(t.status)}</span>
          ${t.engine ? `<span class="badge engine">${escapeHtml(t.engine)}</span>` : ''}
          <span class="badge">${escapeHtml(t.category)}</span>
          <span class="badge pattern">${escapeHtml(t.pattern_type)}</span>
          <span class="badge">${t.box_count} box${t.box_count === 1 ? '' : 'es'}</span>
        </div>
        ${t.included_as ? `<div class="contrast"><span class="label">Included as</span>${escapeHtml(t.included_as)}</div>` : ''}
        ${t.box_count_conflict ? `<div class="conflict"><span class="label">&#9888; Box-count conflict — needs verifying</span>${escapeHtml(t.box_count_conflict)}</div>` : ''}
        ${t.subject ? `<div class="subject"><span class="label">Subject — who it's about</span>${escapeHtml(t.subject.who)}
             <span class="placement">placement: ${escapeHtml(t.subject.placement)}</span>
             ${t.subject.note ? `<div style="margin-top:5px">${escapeHtml(t.subject.note)}</div>` : ''}</div>` : ''}
        ${t.comedic_engine ? `<div class="engine-line"><span class="label">Where the laugh comes from</span>${escapeHtml(t.comedic_engine)}</div>` : ''}
        ${t.valence ? `<div class="valence"><span class="label">Valence rule</span>${escapeHtml(t.valence)}</div>` : ''}
        <ol class="boxes">${boxesHtml}</ol>
        ${(t.worked_example || t.anti_example) ? `<div class="examples">
          ${exampleHtml(t.worked_example, 'good')}
          ${exampleHtml(t.anti_example, 'bad')}
        </div>` : ''}
        <div class="field use"><span class="label">Use when</span>${escapeHtml(t.use_when)}</div>
        <div class="field dont"><span class="label">Do not use when</span>${escapeHtml(t.do_not_use_when)}</div>
        ${t.special_handling ? `<div class="special"><span class="label">Special handling</span>${escapeHtml(t.special_handling)}</div>` : ''}
        <div class="tags">${(t.tags || []).map(x => `<span class="tag">${escapeHtml(x)}</span>`).join('')}</div>
        <div class="review">
          <button data-slug="${escapeHtml(t.slug)}" data-mark="good" class="${mark === 'good' ? 'active-good' : ''}">&#10003; Good</button>
          <button data-slug="${escapeHtml(t.slug)}" data-mark="fix" class="${mark === 'fix' ? 'active-fix' : ''}">&#10005; Needs fix</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.review button').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = markKey(btn.dataset.slug), m = btn.dataset.mark;
      marks[k] = marks[k] === m ? '' : m;
      if (!marks[k]) delete marks[k];
      saveMarks();
      render();
    });
  });
}

function onDatasetChange() {
  blurbEl.textContent = DATASETS[activeKey].blurb;
  buildTabs();
  rebuildFilters();
  renderEngines();
  renderOpenQs();
  render();
}

[searchEl, catEl, patEl, revEl].forEach(el => el.addEventListener('input', render));
onDatasetChange();
loadImgflipMap().then(render);
</script>
</body>
</html>
