<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SLAP Meme Library Review</title>
<style>
  :root {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --border: #dcd8ce;
    --text: #1f1c16;
    --muted: #6b6558;
    --accent: #c1440e;
    --accent-soft: #f5e2d8;
    --ok: #2f6b3a;
    --ok-bg: #e6f0e4;
    --ok-border: #a8c9a2;
    --bad: #a13b3b;
    --bad-bg: #f8e6e6;
    --bad-border: #dda9a9;
    --candidate: #a5752b;
    --candidate-bg: #fbeed7;
    --special-bg: #fff4e0;
    --special-border: #e8c07a;
    --warn-bg: #fdf2d8;
    --warn-border: #dfb54e;
    --engine-bg: #e9edf5;
    --engine-border: #b6c2d8;
    --engine-text: #33456b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  code, .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
  header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header h1 { margin: 0 0 6px; font-size: 1.35rem; }
  header p.blurb { margin: 0; color: var(--muted); font-size: 0.88rem; max-width: 90ch; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    padding: 6px 14px;
    font-size: 0.85rem;
    border-radius: 7px 7px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
  }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .controls input[type="text"] {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.85rem; min-width: 200px; background: var(--bg); color: var(--text);
  }
  select {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.85rem; background: var(--bg); color: var(--text);
  }
  .count { margin-left: auto; font-size: 0.85rem; color: var(--muted); }
  main { max-width: 1500px; margin: 0 auto; padding: 20px 24px 60px; }

  .engines { margin-bottom: 22px; display: flex; flex-direction: column; gap: 12px; }
  .engine-card {
    background: var(--engine-bg);
    border: 1px solid var(--engine-border);
    border-left: 4px solid var(--engine-text);
    border-radius: 8px;
    padding: 13px 16px;
  }
  .engine-card h3 {
    margin: 0 0 6px; font-size: 0.95rem; color: var(--engine-text);
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
  }
  .engine-card .row { font-size: 0.83rem; line-height: 1.45; margin-bottom: 4px; }
  .engine-card .row b {
    color: var(--engine-text); text-transform: uppercase; font-size: 0.66rem;
    letter-spacing: 0.04em; display: inline-block; min-width: 108px; vertical-align: top;
  }
  .engine-card .members { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
  .engine-card .members span {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 999px;
    background: #fff; border: 1px solid var(--engine-border); color: var(--engine-text);
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
  }

  .open-qs {
    background: var(--warn-bg); border: 1px solid var(--warn-border);
    border-radius: 8px; padding: 12px 16px 12px 18px; margin-bottom: 22px;
  }
  .open-qs h3 { margin: 0 0 6px; font-size: 0.9rem; color: #7a5b12; }
  .open-qs ol { margin: 0; padding-left: 20px; font-size: 0.83rem; line-height: 1.5; }
  .open-qs li { margin-bottom: 5px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 18px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  }
  .card-img {
    width: 100%; height: 230px; background: #efece4;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .card-img .broken { font-size: 0.75rem; color: var(--muted); padding: 10px; text-align: center; }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 9px; }
  .card-title h2 { margin: 0; font-size: 1.02rem; font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 0.67rem; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap;
  }
  .badge.status { background: var(--candidate-bg); color: var(--candidate); }
  .badge.pattern { background: #e4e8f0; color: #33456b; }
  .badge.engine {
    background: var(--engine-text); color: #fff;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 0.64rem;
  }

  .subject {
    background: #f3f0ff; border: 1px solid #cdc2ee; border-radius: 6px;
    padding: 8px 10px; font-size: 0.81rem; line-height: 1.4;
  }
  .subject .label, .valence .label, .engine-line .label {
    font-weight: 700; text-transform: uppercase; font-size: 0.66rem;
    letter-spacing: 0.04em; display: block; margin-bottom: 3px;
  }
  .subject .label { color: #5b48a8; }
  .subject .placement {
    display: inline-block; font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 0.72rem; background: #fff; border: 1px solid #cdc2ee;
    border-radius: 4px; padding: 1px 6px; margin-top: 4px; color: #5b48a8;
  }
  .engine-line { font-size: 0.83rem; line-height: 1.45; }
  .engine-line .label { color: var(--engine-text); }
  .valence {
    background: #fff8ec; border: 1px solid var(--special-border);
    border-left: 3px solid #c98b1e; border-radius: 6px;
    padding: 8px 10px; font-size: 0.81rem; line-height: 1.45;
  }
  .valence .label { color: #8a5a00; }

  .boxes { margin: 0; padding-left: 18px; font-size: 0.82rem; }
  .boxes li { margin-bottom: 4px; }
  .boxes li b { color: var(--muted); font-weight: 600; }
  .boxes .vnote { color: var(--muted); font-style: italic; font-size: 0.76rem; display: block; }

  .field { font-size: 0.83rem; line-height: 1.42; }
  .field .label {
    font-weight: 700; color: var(--muted); text-transform: uppercase;
    font-size: 0.66rem; letter-spacing: 0.04em; display: block; margin-bottom: 2px;
  }
  .field.use .label { color: var(--ok); }
  .field.dont .label { color: var(--accent); }

  .examples { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  @media (max-width: 620px) { .examples { grid-template-columns: 1fr; } }
  .ex { border-radius: 6px; padding: 9px 10px; font-size: 0.79rem; line-height: 1.4; }
  .ex.good { background: var(--ok-bg); border: 1px solid var(--ok-border); }
  .ex.bad  { background: var(--bad-bg); border: 1px solid var(--bad-border); }
  .ex .label {
    font-weight: 700; text-transform: uppercase; font-size: 0.65rem;
    letter-spacing: 0.04em; display: block; margin-bottom: 5px;
  }
  .ex.good .label { color: var(--ok); }
  .ex.bad .label { color: var(--bad); }
  .ex .subj { font-size: 0.72rem; color: var(--muted); margin-bottom: 5px; }
  .ex ol { margin: 0 0 6px; padding-left: 17px; }
  .ex ol li {
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 0.72rem; margin-bottom: 2px; letter-spacing: 0.01em;
  }
  .ex .why { font-style: italic; color: #4a4438; }
  .ex .timing { margin-top: 5px; font-size: 0.72rem; color: var(--muted); }

  .special, .conflict, .contrast {
    border-radius: 6px; padding: 8px 10px; font-size: 0.79rem; line-height: 1.4;
  }
  .special { background: var(--special-bg); border: 1px solid var(--special-border); }
  .conflict { background: var(--warn-bg); border: 1px solid var(--warn-border); }
  .contrast { background: #eef1f6; border: 1px dashed var(--engine-border); color: var(--engine-text); }
  .special .label, .conflict .label, .contrast .label {
    font-weight: 700; text-transform: uppercase; font-size: 0.65rem;
    letter-spacing: 0.04em; display: block; margin-bottom: 3px;
  }
  .special .label { color: #8a5a00; }
  .conflict .label { color: #8a6410; }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 0.67rem; padding: 2px 7px; border-radius: 5px; background: #eeece4; color: var(--muted); }
  .review { display: flex; gap: 6px; margin-top: 4px; border-top: 1px solid var(--border); padding-top: 10px; }
  .review button {
    flex: 1; padding: 6px 4px; font-size: 0.75rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;
  }
  .review button.active-good { background: #d9ecd8; border-color: var(--ok); color: var(--ok); }
  .review button.active-fix { background: #f6dede; border-color: var(--bad); color: var(--bad); }
  .card.marked-good { outline: 2px solid var(--ok); }
  .card.marked-fix { outline: 2px solid var(--bad); }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; padding: 10px 24px 30px; }
  .no-results { color: var(--muted); padding: 40px; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <h1>SLAP Meme Library Review</h1>
  <p class="blurb" id="blurb"></p>
  <div class="controls">
    <input type="text" id="search" placeholder="Search slug, purpose, tags…">
    <select id="categoryFilter"><option value="">All categories</option></select>
    <select id="patternFilter"><option value="">All pattern types</option></select>
    <select id="reviewFilter">
      <option value="">All review states</option>
      <option value="good">Marked good</option>
      <option value="fix">Marked needs fix</option>
      <option value="unmarked">Unmarked</option>
    </select>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <div class="engines" id="engines"></div>
  <div class="open-qs" id="openQs" style="display:none"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Marks are stored in this browser only (localStorage), per dataset — not saved back to the JSON files. Example captions are illustrative shape demos, never factual claims.</footer>
<script>
const DATASETS = {"proposal": {"label": "Schema proposal (4)", "blurb": "Extended schema on one comedic-engine cluster plus a contrast case. React to the SHAPE \u2014 engine, subject, valence, worked vs anti example.", "meta": {"purpose": "PROPOSAL ONLY -- not the live library. Demonstrates an extended entry schema for prompts/meme_library.DRAFT.json on ONE comedic-engine cluster (drake, distracted-boyfriend, left-exit-12-off-ramp), plus one deliberate contrast template (two-buttons) that sits in the same category but a DIFFERENT engine. Review the shape here before it is applied to all 30 templates.", "why_this_exists": "The v1 library documented template MECHANICS (which panel is which) but omitted the three things that make a meme land: who it is about, where the laugh comes from, and the required valence relationship between boxes. On drake the v1 entry had the valence INVERTED -- it described box 1 as the smarter/preferred option, when the joke requires box 1 to be the worse option the subject actually chose. That error would actively steer the writer toward earnest, non-funny memes.", "new_fields": {"engine": "Cluster key. Templates sharing a comedic engine share their comedic_engine, valence_rule, choice_state and failure_mode, defined once under _meta.engines. Lets ~30 templates be fixed as ~5-7 clusters instead of 30 independent rewrites, and keeps sibling templates consistent with each other.", "subject": "Who the meme is ABOUT -- the person/team/org whose decision or reaction is the joke. placement is one of: 'implied' (no box; name them in surrounding copy), 'box:N' (a physical panel labels the subject), or 'none' (subjectless template). v1 had no subject concept at all, which is why its entries produced abstract comparisons with no protagonist.", "comedic_engine": "One sentence on where the laugh actually comes from -- almost always a violated expectation.", "valence": "The REQUIRED relationship between boxes, stated as a rule a writer can be caught violating. This is the checkable part.", "worked_example": "A concrete, correctly-shaped example. One example teaches an LLM more than three sentences of description.", "anti_example": "The plausible near-miss that fails -- usually the earnest/flat version. Exists to stop regression toward the engine's failure_mode."}, "examples_are_illustrative": "IMPORTANT: worked_example and anti_example captions demonstrate SHAPE ONLY. They are not factual claims and must never be reused as source material or treated as true. Real captions must be built from game_state.json ground truth.", "open_questions_for_review": ["engine vs pattern_type -- kept here as two separate axes: engine = shared comedic mechanism, pattern_type = structural caption-to-panel mapping. drake and left-exit share BOTH; distracted-boyfriend shares the engine but has a different pattern_type (it labels the subject in a box). Keep both axes, or collapse to one?", "distracted-boyfriend box_count -- this proposal says 3 per review feedback, but prompts/meme_reference.txt lists it under '2 panels' and generate_memes.py _expand_boxes() has no case for it, so the pipeline currently sends only 2 captions and the subject panel likely renders uncaptioned. Needs verification against a real Imgflip render; may require a code + reference fix, not just metadata.", "Should status stay a flat candidate/verified, or split into semantics_reviewed vs example_reviewed? The box semantics and the worked examples are separately reviewable.", "Are worked_example captions worth carrying at all, given they must never be reused as fact? Alternative is shape-only skeletons with no real names."], "engines": {"subject_abandons_sensible_for_funky": {"summary": "A named subject faces an obviously correct option and visibly goes with the worse, pettier, or stranger one.", "comedic_engine": "The laugh is not the comparison itself -- it is that a real, named person actually chose the dumb thing, while the audience can plainly see the right answer.", "valence_rule": "The abandoned option MUST be genuinely appealing or rational. The chosen option MUST be petty, self-defeating, or conspicuously odd. NEVER write the chosen option as the smarter one.", "requires_subject": true, "choice_state": "already made -- the subject has committed and we are reacting to it", "failure_mode": "The straight upgrade: both options ranked with the second genuinely better. Produces an earnest endorsement or an ad, with zero comedy.", "members": ["drake", "distracted-boyfriend", "left-exit-12-off-ramp"]}, "forced_choice_dilemma": {"summary": "A subject is frozen between two options of the SAME valence -- both appealing, or both painful -- that cannot coexist.", "comedic_engine": "The paralysis is the joke, not the options. Either the audience finds the answer obvious and the subject clearly does not, or the two buttons expose a hypocrisy the subject created themselves.", "valence_rule": "The two options MUST be same-valence and genuinely in conflict. If one is clearly better there is no sweat and the meme dies.", "requires_subject": true, "choice_state": "not yet made -- the subject is still sweating", "failure_mode": "Writing it as a ranked preference. That is the abandons-sensible engine wearing the wrong template.", "members": ["two-buttons"]}}, "scope": "4 of 30 templates, for shape review only. template_id values remain inherited from CURATED_TEMPLATES in generate_memes.py and are unchanged."}, "templates": [{"slug": "drake", "template_id": "181913649", "status": "candidate", "category": "comparison_preference", "engine": "subject_abandons_sensible_for_funky", "pattern_type": "reject_approve", "box_count": 2, "subject": {"who": "The person, team, or front office making the choice.", "placement": "implied", "note": "Drake is the stand-in for the subject. Name them in the surrounding paragraph -- the boxes carry the two options only."}, "comedic_engine": "A named figure had the obvious move available and went with the pettier one instead.", "valence": "Box 0 MUST be the obviously desirable/rational thing. Box 1 MUST be the petty, self-defeating, or odd thing the subject actually chose. Never write box 1 as the smarter option -- that inverts the joke into an endorsement.", "boxes": [{"index": 0, "purpose": "the sensible, obviously appealing option the subject is waving off", "valence": "positive -- must read as the right answer"}, {"index": 1, "purpose": "the petty or self-defeating option the subject is actually going with", "valence": "negative or absurd -- must read as the wrong answer they picked anyway"}], "use_when": "A specific, named figure passed on the obvious move and chose something pettier, stranger, or plainly worse -- and that choice is already public.", "do_not_use_when": "No specific subject is making the choice, or box 1 is genuinely the better option. A ranked upgrade with no bad decision is an ad, not a joke.", "worked_example": {"subject": "Jeanie Buss", "boxes": ["SELLING THE LAKERS FOR $2B MORE A YEAR LATER", "FIGHTING WITH HER SIBLINGS"], "why_it_lands": "Box 0 is the rational windfall anyone would take. Box 1 is the pettiness she chose instead. The subject is named in the copy, not in a box."}, "anti_example": {"boxes": ["WATCHING THE GAME ON ESPN", "READING ABOUT IT IN SLAP THE NEXT DAY"], "why_it_fails": "Straight upgrade, no subject, nobody makes a bad decision -- it reads as an ad. This is the example currently sitting in prompts/meme_reference.txt, so the existing reference material is teaching the wrong instinct."}, "special_handling": null, "tags": ["comparison", "preference", "bad-decision", "subject-implied", "reject-approve"], "note": "AI-authored box semantics, not yet reviewed by Abram. Valence CORRECTED from v1 per review feedback -- v1 had box 1 as the better option."}, {"slug": "distracted-boyfriend", "template_id": "112126428", "status": "candidate", "category": "comparison_preference", "engine": "subject_abandons_sensible_for_funky", "pattern_type": "entity_labeling", "box_count": 3, "box_count_conflict": "v1 said 2. Review feedback says 3, with the subject in box 2. prompts/meme_reference.txt lists this template under '2 panels' and generate_memes.py _expand_boxes() has no case for it, so the pipeline currently sends 2 captions and the subject panel likely renders uncaptioned. VERIFY against a real render before trusting this entry.", "subject": {"who": "The person or team doing the looking -- the one moving on.", "placement": "box:2", "note": "Unlike drake, the subject IS captioned here. That label is what makes the meme land; leaving it blank strands the joke."}, "comedic_engine": "The subject is visibly turning away, in public, from the thing they were committed to -- and everyone can see them doing it.", "valence": "Box 0 MUST be the established commitment being left behind. Box 1 is the new object of attention -- it does NOT have to be worse than box 0, but it must be notable that the subject is moving on. Box 2 MUST name the subject doing the looking.", "boxes": [{"index": 0, "purpose": "the established thing being neglected -- the prior commitment, incumbent, or plan", "valence": "was the safe/expected choice"}, {"index": 1, "purpose": "the new thing catching the subject's eye", "valence": "notable -- either worse, or simply surprising that they are moving on"}, {"index": 2, "purpose": "the subject themselves -- the person or team doing the looking", "valence": "neutral -- this is a label, not a judgment"}], "use_when": "A team or figure publicly moves on from an incumbent or prior commitment toward a new option, and the pivot itself is the story.", "do_not_use_when": "Nobody is abandoning anything, or you cannot name the subject for box 2. Without the subject label this collapses into a generic two-way comparison -- use drake instead.", "worked_example": {"subject": "The Vikings", "boxes": ["J.J. MCCARTHY", "KYLER MURRAY", "THE VIKINGS"], "why_it_lands": "Box 0 is who they were committed to, box 1 let activeKey = 'proposal';

const grid = document.getElementById('grid');
const enginesEl = document.getElementById('engines');
const openQsEl = document.getElementById('openQs');
const blurbEl = document.getElementById('blurb');
const tabsEl = document.getElementById('tabs');
const searchEl = document.getElementById('search');
const catEl = document.getElementById('categoryFilter');
const patEl = document.getElementById('patternFilter');
const revEl = document.getElementById('reviewFilter');
const countEl = document.getElementById('count');

let IMG_MAP = {};
let marks = {};
try { marks = JSON.parse(localStorage.getItem('slap_meme_review_marks') || '{}'); } catch (e) { marks = {}; }
function saveMarks() {
  try { localStorage.setItem('slap_meme_review_marks', JSON.stringify(marks)); } catch (e) {}
}
function markKey(slug) { return activeKey + '::' + slug; }

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}
function memegenLink(id) { return 'https://imgflip.com/memegenerator/' + id; }
function fallbackLinkHtml(templateId) {
  return `<div class="broken">No live preview matched.<br>
    <a href="${memegenLink(templateId)}" target="_blank" rel="noopener noreferrer">Open blank template on Imgflip &#8599;</a><br>
    <span style="font-size:0.68rem">(this page also shows its real caption-box count)</span>
  </div>`;
}
function handleImgError(img) {
  img.parentElement.innerHTML = fallbackLinkHtml(img.dataset.templateId);
}

async function loadImgflipMap() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const resp = await fetch('https://api.imgflip.com/get_memes', { signal: controller.signal });
    clearTimeout(timeout);
    const data = await resp.json();
    if (data && data.success) {
      (data.data.memes || []).forEach(m => { IMG_MAP[String(m.id)] = m.url; });
    }
  } catch (e) { /* fall back to links */ }
}

function buildTabs() {
  tabsEl.innerHTML = '';
  Object.keys(DATASETS).forEach(key => {
    const b = document.createElement('button');
    b.textContent = DATASETS[key].label;
    if (key === activeKey) b.classList.add('active');
    b.addEventListener('click', () => { activeKey = key; onDatasetChange(); });
    tabsEl.appendChild(b);
  });
}

function rebuildFilters() {
  const ts = DATASETS[activeKey].templates;
  const fill = (el, vals, allLabel) => {
    el.innerHTML = `<option value="">${allLabel}</option>`;
    [...new Set(vals)].sort().forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      el.appendChild(o);
    });
  };
  fill(catEl, ts.map(t => t.category), 'All categories');
  fill(patEl, ts.map(t => t.pattern_type), 'All pattern types');
}

function renderEngines() {
  const meta = DATASETS[activeKey].meta;
  const engines = meta.engines;
  enginesEl.innerHTML = '';
  if (!engines) return;
  Object.keys(engines).forEach(name => {
    const e = engines[name];
    const div = document.createElement('div');
    div.className = 'engine-card';
    div.innerHTML = `
      <h3>engine: ${escapeHtml(name)}</h3>
      <div class="row"><b>Summary</b> ${escapeHtml(e.summary)}</div>
      <div class="row"><b>Laugh comes from</b> ${escapeHtml(e.comedic_engine)}</div>
      <div class="row"><b>Valence rule</b> ${escapeHtml(e.valence_rule)}</div>
      <div class="row"><b>Choice state</b> ${escapeHtml(e.choice_state)}</div>
      <div class="row"><b>Fails when</b> ${escapeHtml(e.failure_mode)}</div>
      <div class="members">${(e.members || []).map(m => `<span>${escapeHtml(m)}</span>`).join('')}</div>
    `;
    enginesEl.appendChild(div);
  });
}

function renderOpenQs() {
  const meta = DATASETS[activeKey].meta;
  const qs = meta.open_questions_for_review;
  if (!qs || !qs.length) { openQsEl.style.display = 'none'; return; }
  openQsEl.style.display = '';
  openQsEl.innerHTML = `<h3>Open questions for review</h3><ol>${
    qs.map(q => `<li>${escapeHtml(q)}</li>`).join('')
  }</ol>`;
}

function exampleHtml(ex, kind) {
  if (!ex) return '';
  const isGood = kind === 'good';
  const boxes = (ex.boxes || []).map(b => `<li>${escapeHtml(b)}</li>`).join('');
  return `<div class="ex ${isGood ? 'good' : 'bad'}">
    <span class="label">${isGood ? '\u2713 Worked example' : '\u2715 Anti-example'}</span>
    ${ex.subject ? `<div class="subj">Subject: <b>${escapeHtml(ex.subject)}</b></div>` : ''}
    <ol>${boxes}</ol>
    <div class="why">${escapeHtml(ex.why_it_lands || ex.why_it_fails || '')}</div>
    ${ex.timing ? `<div class="timing">Timing: ${escapeHtml(ex.timing)}</div>` : ''}
  </div>`;
}

function render() {
  const ds = DATASETS[activeKey];
  const q = searchEl.value.trim().toLowerCase();
  const cat = catEl.value, pat = patEl.value, rev = revEl.value;

  const filtered = ds.templates.filter(t => {
    if (cat && t.category !== cat) return false;
    if (pat && t.pattern_type !== pat) return false;
    const mark = marks[markKey(t.slug)] || '';
    if (rev === 'good' && mark !== 'good') return false;
    if (rev === 'fix' && mark !== 'fix') return false;
    if (rev === 'unmarked' && mark) return false;
    if (q) {
      const hay = [
        t.slug, t.category, t.pattern_type, t.engine, t.use_when, t.do_not_use_when,
        t.comedic_engine, t.valence, ...(t.tags || []),
        ...(t.boxes || []).map(b => b.purpose)
      ].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  countEl.textContent = `${filtered.length} / ${ds.templates.length} templates`;
  grid.innerHTML = '';
  if (!filtered.length) { grid.innerHTML = '<div class="no-results">No templates match.</div>'; return; }

  filtered.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card';
    const mark = marks[markKey(t.slug)];
    if (mark === 'good') card.classList.add('marked-good');
    if (mark === 'fix') card.classList.add('marked-fix');

    const boxesHtml = (t.boxes || []).map(b =>
      `<li><b>Box ${b.index}:</b> ${escapeHtml(b.purpose)}` +
      (b.valence ? `<span class="vnote">valence: ${escapeHtml(b.valence)}</span>` : '') + `</li>`
    ).join('');

    const matchedUrl = IMG_MAP[String(t.template_id)];
    const imgHtml = matchedUrl
      ? `<img src="${escapeHtml(matchedUrl)}" alt="${escapeHtml(t.slug)}" loading="lazy"
             data-template-id="${escapeHtml(t.template_id)}" onerror="handleImgError(this)">`
      : fallbackLinkHtml(t.template_id);

    card.innerHTML = `
      <div class="card-img">${imgHtml}</div>
      <div class="card-body">
        <div class="card-title"><h2>${escapeHtml(t.slug)}</h2></div>
        <div class="badges">
          <span class="badge status">${escapeHtml(t.status)}</span>
          ${t.engine ? `<span class="badge engine">${escapeHtml(t.engine)}</span>` : ''}
          <span class="badge">${escapeHtml(t.category)}</span>
          <span class="badge pattern">${escapeHtml(t.pattern_type)}</span>
          <span class="badge">${t.box_count} box${t.box_count === 1 ? '' : 'es'}</span>
        </div>
        ${t.included_as ? `<div class="contrast"><span class="label">Included as</span>${escapeHtml(t.included_as)}</div>` : ''}
        ${t.box_count_conflict ? `<div class="conflict"><span class="label">&#9888; Box-count conflict — needs verifying</span>${escapeHtml(t.box_count_conflict)}</div>` : ''}
        ${t.subject ? `<div class="subject"><span class="label">Subject — who it's about</span>${escapeHtml(t.subject.who)}
             <span class="placement">placement: ${escapeHtml(t.subject.placement)}</span>
             ${t.subject.note ? `<div style="margin-top:5px">${escapeHtml(t.subject.note)}</div>` : ''}</div>` : ''}
        ${t.comedic_engine ? `<div class="engine-line"><span class="label">Where the laugh comes from</span>${escapeHtml(t.comedic_engine)}</div>` : ''}
        ${t.valence ? `<div class="valence"><span class="label">Valence rule</span>${escapeHtml(t.valence)}</div>` : ''}
        <ol class="boxes">${boxesHtml}</ol>
        ${(t.worked_example || t.anti_example) ? `<div class="examples">
          ${exampleHtml(t.worked_example, 'good')}
          ${exampleHtml(t.anti_example, 'bad')}
        </div>` : ''}
        <div class="field use"><span class="label">Use when</span>${escapeHtml(t.use_when)}</div>
        <div class="field dont"><span class="label">Do not use when</span>${escapeHtml(t.do_not_use_when)}</div>
        ${t.special_handling ? `<div class="special"><span class="label">Special handling</span>${escapeHtml(t.special_handling)}</div>` : ''}
        <div class="tags">${(t.tags || []).map(x => `<span class="tag">${escapeHtml(x)}</span>`).join('')}</div>
        <div class="review">
          <button data-slug="${escapeHtml(t.slug)}" data-mark="good" class="${mark === 'good' ? 'active-good' : ''}">&#10003; Good</button>
          <button data-slug="${escapeHtml(t.slug)}" data-mark="fix" class="${mark === 'fix' ? 'active-fix' : ''}">&#10005; Needs fix</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.review button').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = markKey(btn.dataset.slug), m = btn.dataset.mark;
      marks[k] = marks[k] === m ? '' : m;
      if (!marks[k]) delete marks[k];
      saveMarks();
      render();
    });
  });
}

function onDatasetChange() {
  blurbEl.textContent = DATASETS[activeKey].blurb;
  buildTabs();
  rebuildFilters();
  renderEngines();
  renderOpenQs();
  render();
}

[searchEl, catEl, patEl, revEl].forEach(el => el.addEventListener('input', render));
onDatasetChange();
loadImgflipMap().then(render);
</script>
</body>
</html>
