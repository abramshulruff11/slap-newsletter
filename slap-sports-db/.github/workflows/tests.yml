name: Tests

# Runs the schema tests against a real Postgres 16 — the same major version
# the hosted free tiers (Supabase, Neon) run. The suite SKIPS without a
# database, so this job fails if anything skipped: a green run that tested
# nothing is the failure mode this repo exists to prevent.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run the schema tests (no skips allowed)
        run: |
          python -m pytest -q | tee pytest.log
          if grep -q "skipped" pytest.log; then
            echo "::error::Tests were skipped — the database tests did not run."
            exit 1
          fi
      - name: Migrate a fresh database from the CLI, twice
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE cli_check"
          url="postgresql://postgres:postgres@localhost:5432/cli_check"
          python -m sports_db.migrate --database-url "$url"
          python -m sports_db.migrate --database-url "$url" | grep -q "Up to date"
          python -m sports_db.migrate --database-url "$url" --status
