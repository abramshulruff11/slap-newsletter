name: Daily SLAP Newsletter

on:
  schedule:
    # 06:17 UTC = 2:17 AM EDT (1:17 AM EST in winter). Moved earlier and off
    # the round hour to dodge GitHub Actions scheduled-workflow queueing during
    # peak load — round-hour crons see the worst delays. The run itself takes
    # ~15 min (Pass 2 uses Opus 4.7), so this gives several hours of buffer
    # before Abram's morning review.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      skip_editor:
        description: 'Skip the editor pass'
        type: boolean
        default: false
      skip_gifs:
        description: 'Skip GIF lookup'
        type: boolean
        default: false
      simulate_api_failures:
        # SLA-54 drill. Makes every Claude pass fail on cue so the retry path
        # can be watched end to end in a real run, instead of waiting for
        # Anthropic to have a bad day. A dispatch input ONLY -- scheduled runs
        # carry no inputs, so this resolves to empty and the hook is a getenv
        # and a return. Locked by uat/tests/test_api_retry.py.
        #   2       two rate limits per pass, then recover
        #   529:1   one overload per pass
        #   fatal   a 400 -- must NOT be retried, run should fail fast
        #   exhaust never recovers -- run should give up, not hang
        description: 'Retry drill: 2 | 529:1 | timeout:3 | fatal | exhaust (blank = off)'
        type: string
        default: ''
      rerun_of_failed_run:
        # SLA-55. A plain re-dispatch does a full run: a SECOND email (SLA-52
        # is otherwise silent about it having already fired today) and a SECOND
        # Substack draft that orphans the first (substack_post_state.json just
        # gets overwritten). That risk is what discourages using the one tool
        # available for fixing a bad morning run. With this on: the email step
        # skips sending if today's already went out (email_sent_state.json,
        # committed right after a successful send — run_status.json itself is
        # gitignored and reset every run, so it cannot answer this across a
        # fresh runner), and the draft step updates today's existing draft in
        # place (substack_poc/publish.py --rerun-safe) instead of minting a
        # new one. Opt-in and default off, so a deliberate full fresh run
        # (e.g. testing) is unaffected.
        description: 'This is a rerun of a failed/partial attempt today (skip duplicate email, update existing Substack draft)'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Python fully buffers stdout when it's not a TTY (i.e. always, in CI), so
      # print() output only reaches the log on a normal exit -- never on a run
      # that gets killed by timeout-minutes. That left the 2026-08-21/22/23 hangs
      # completely silent in the logs even though fetch_content.py prints
      # progress per feed/handle. Unbuffered output means a future hang shows
      # exactly where it got stuck instead of nothing at all.
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      IMGFLIP_USERNAME: ${{ secrets.IMGFLIP_USERNAME }}
      IMGFLIP_PASSWORD: ${{ secrets.IMGFLIP_PASSWORD }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      # Residential proxy. ESPN's scoreboard API returned 403 to this runner's
      # datacenter IP on every run from at least 2026-08-14 to 2026-09-04, and
      # the ESPN RSS feeds answered 202 (a bot wall) since 2026-07-15. Both
      # fetchers now retry blocked requests through PROXY_URL — the same fix
      # that unblocked Substack in June. Job-level so every step can use it.
      PROXY_URL: ${{ secrets.PROXY_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Before the installs, so a pip failure is a REPORTED stage rather than a
      # run that reported nothing at all. Needs no dependencies of its own.
      - name: Start pipeline status
        run: python pipeline_status.py start

      # SLA-56 dead man's switch, first half. Everything else that watches this
      # pipeline runs inside this job, so none of it can report a job that never
      # started or was killed. This pings an EXTERNAL service (healthchecks.io);
      # the service emails Abram if no finish ping follows by the cutoff — see
      # docs/dead_mans_switch.md for the cutoff and why. Before the installs so
      # a run that dies in pip still counts as "started". heartbeat.py is stdlib
      # only, always exits 0, and is a no-op until the secret exists. Not a
      # pipeline stage: it is monitoring, not part of making the issue.
      - name: Heartbeat — started
        continue-on-error: true
        env:
          SLAP_HEARTBEAT_URL: ${{ secrets.SLAP_HEARTBEAT_URL }}
        run: python heartbeat.py start

      - name: Install dependencies
        run: bash ci/run_stage.sh "Install dependencies" pip install -r requirements.txt

      # SLA-57: what a green run actually installed, so the next pin bump can
      # be read out of an artifact instead of an Actions log that will
      # eventually age out. Diagnostic only — not a pipeline stage, so it
      # isn't in PIPELINE_STAGES and can't affect the run's verdict.
      - name: Record installed dependency versions
        if: always()
        continue-on-error: true
        run: pip freeze > pip-freeze.txt

      - name: Upload dependency versions artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pip-freeze
          path: pip-freeze.txt
          retention-days: 90

      - name: Install Playwright Chromium
        run: bash ci/run_stage.sh "Install Playwright Chromium" python -m playwright install --with-deps chromium

      # SLA-52: from here down, every stage runs through ci/run_stage.sh, which
      # tees its output to ci_logs/, records the exit code into run_status.json,
      # and re-raises. That record is what the one daily status email reads back
      # to say WHICH stage broke and WHY, instead of leaving the answer in this
      # job log where only a visit to the Actions tab would find it. The wrapper
      # is invisible to pass/fail: a critical stage still halts the job.
      - name: Fetch content
        run: bash ci/run_stage.sh "Fetch content" python fetch_content.py

      - name: Fetch sports data
        run: bash ci/run_stage.sh "Fetch sports data" python fetch_sports_data.py

      # Loud, not blocking: a blocked ESPN fetch fails THIS step and annotates
      # the run, but the newsletter, email and Substack draft still go out —
      # they do not need scores to ship. Before this step existed a hollow
      # game_state.json (standings, zero games) passed as healthy for weeks.
      - name: Check sports data health
        continue-on-error: true
        run: bash ci/run_stage.sh "Check sports data health" python check_game_state.py

      - name: Validate raw content
        run: |
          bash ci/run_stage.sh "Validate raw content" <<'STAGE'
          python -c "
          import json, sys
          data = json.load(open('raw_content.json'))
          headlines = data.get('news_headlines', [])
          tweets = data.get('tweets', [])
          if not headlines and not tweets:
              print('ERROR: Both headlines and tweets are empty')
              sys.exit(1)
          print(f'Found {len(headlines)} headlines and {len(tweets)} tweets')
          "
          STAGE

      # SLA-74: the generator gets a hard 17-minute limit. A hung Claude call
      # (a response that never arrives, as opposed to a fast 429/529) is not
      # bounded by the retry logic -- each attempt can take the full
      # API_REQUEST_TIMEOUT, several times over -- and without this limit it
      # runs into the JOB's 30-minute cap, which may kill the run before the
      # always() status email. Budget: the stage starts ~7 min in (fetches took
      # 5.5 min on 2026-09-22); 7 + 17 leaves time for the email. A normal
      # generate takes ~4.5 min. `timeout` runs INSIDE the wrapper so the stage
      # is still recorded, with the explanation below in its log tail.
      - name: Generate newsletter
        env:
          # Empty on every scheduled run; only a manual dispatch can set it.
          SLAP_SIMULATE_API_FAILURES: ${{ inputs.simulate_api_failures }}
          SKIP_EDITOR: ${{ inputs.skip_editor }}
          SKIP_GIFS: ${{ inputs.skip_gifs }}
        run: |
          bash ci/run_stage.sh "Generate newsletter" <<'STAGE'
          FLAGS=""
          if [ "$SKIP_EDITOR" = "true" ]; then FLAGS="$FLAGS --no-editor"; fi
          if [ "$SKIP_GIFS" = "true" ]; then FLAGS="$FLAGS --no-gifs"; fi
          timeout --kill-after=30s 17m python generate_newsletter.py $FLAGS
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "ERROR: Generate newsletter ran past its 17-minute limit and was stopped, so the status email could still go out. The lines above show which pass it was waiting on -- most likely the Claude API stopped responding."
          fi
          exit $code
          STAGE

      - name: Render box score images (one per sport, MLB chunked)
        run: |
          bash ci/run_stage.sh "Render box score images" <<'STAGE'
          rm -f box_score/box_score_sport_*.html box_score/box_score_sport_*.png
          python box_score/build_box_score.py --per-sport
          python box_score/render_pngs.py
          STAGE

      - name: Verify outputs
        run: |
          bash ci/run_stage.sh "Verify outputs" <<'STAGE'
          for f in newsletter_draft.html newsletter_substack.html; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing output file: $f"
              exit 1
            fi
          done
          echo "All output files present"
          STAGE

      # continue-on-error: losing today's snapshot is worth an email, not worth
      # withholding the newsletter it snapshots.
      - name: Archive outputs
        continue-on-error: true
        run: |
          bash ci/run_stage.sh "Archive outputs" <<'STAGE'
          DATE=$(date -u +"%Y-%m-%d")
          ARCHIVE_DIR="archive/$DATE"
          mkdir -p "$ARCHIVE_DIR"
          cp newsletter_draft.html "$ARCHIVE_DIR/"
          cp newsletter_substack.html "$ARCHIVE_DIR/"
          cp newsletter_email.html "$ARCHIVE_DIR/"
          cp raw_content.json "$ARCHIVE_DIR/"
          if [ -f recent_output.json ]; then
            cp recent_output.json "$ARCHIVE_DIR/"
          fi
          # The Pass 1 plan as Pass 2 received it (post §2.4/§2.3). Root copy is
          # gitignored; THIS archived copy is the record that makes a media
          # shortfall diagnosable after the fact — see 2026-09-01, when 1 meme
          # shipped against a floor of 3 and the evidence did not exist.
          if [ -f story_plan.json ]; then
            cp story_plan.json "$ARCHIVE_DIR/"
          fi
          cp box_score/box_score_sport_*.png "$ARCHIVE_DIR/" 2>/dev/null || true
          echo "Archived to $ARCHIVE_DIR"
          STAGE

      # Push BEFORE email so the box score images are live on GitHub: the size
      # guard in email_newsletter.py falls back to raw.githubusercontent URLs on
      # huge-slate days, and those must resolve when Gmail fetches them.
      # continue-on-error: a push hiccup must never block the email (the product).
      - name: Commit and push outputs
        continue-on-error: true
        run: |
          bash ci/run_stage.sh "Commit and push outputs" <<'STAGE'
          git config user.name "SLAP Bot"
          git config user.email "slap-bot@users.noreply.github.com"
          git add raw_content.json newsletter_draft.html newsletter_substack.html newsletter_email.html recent_output.json gif_history.json meme_history.json archive/ || true
          # -A so renamed/removed per-sport box score files (the set changes with
          # the daily slate size) are staged as DELETIONS too — a bare glob only
          # matches existing files and leaves stale deletions unstaged, which
          # then breaks `git pull --rebase` ("you have unstaged changes").
          git add -A box_score/ || true
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "SLAP newsletter output for $DATE" || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push
          STAGE

      # Create the Substack DRAFT (tweets embedded, GIFs/memes included, box scores
      # uploaded) and record a handoff file naming today's draft id. This is the
      # MORNING half of the two-job auto-post: the companion publish-substack.yml
      # job auto-publishes this draft at 12:30 PM ET unless Abram published, edited
      # away, or deleted it first. (Substack removed its /schedule API endpoint, so
      # we schedule via our own cron + an immediate publish instead.) Routes through
      # a residential proxy (PROXY_URL) because GitHub Actions' datacenter IP is
      # otherwise Cloudflare-blocked.
      #
      # continue-on-error since SLA-52. It used to be blocking so that a missing
      # draft surfaced — but "surfaced" meant a red square in the Actions tab.
      # The failure now reaches Abram's inbox with the error text in it, and the
      # final gate below still turns it into a red run, so halting here would
      # only cost the steps underneath.
      - name: Create Substack draft (auto-publishes at 12:30 PM ET)
        continue-on-error: true
        env:
          SUBSTACK_COOKIES_STRING: ${{ secrets.SUBSTACK_COOKIES_STRING }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          bash ci/run_stage.sh "Create Substack draft" <<'STAGE'
          # Inside the wrapper, not above it: a pip failure here would
          # otherwise fail the step while recording nothing, so the stage
          # would read as "never ran" in the status email — a stage that
          # silently vanishes is the hole this mechanism exists to close.
          pip install python-substack==0.1.22 curl_cffi==0.16.3
          FLAGS=""
          if [ "${{ inputs.rerun_of_failed_run }}" = "true" ]; then
            FLAGS="--rerun-safe"
          fi
          python substack_poc/publish.py newsletter_substack.html --draft \
            --state-out substack_post_state.json $FLAGS
          STAGE

      # Commit the handoff so the separate noon workflow (which checks out main) can
      # read today's draft id.
      - name: Commit Substack draft handoff
        continue-on-error: true
        run: |
          bash ci/run_stage.sh "Commit Substack draft handoff" <<'STAGE'
          git config user.name "SLAP Bot"
          git config user.email "slap-bot@users.noreply.github.com"
          git add substack_post_state.json
          git commit -m "Substack draft handoff for $(date -u +%Y-%m-%d)" || echo "No handoff change to commit"
          git pull --rebase -X theirs origin main
          git push
          STAGE

      # The other half of the 12:30 PM ET target. publish-substack.yml polls
      # every 30 minutes and publishes at the first slot past 12:30 ET -- but
      # that only works if the draft EXISTS by then. GitHub delays this workflow
      # by hours (measured +5h05m over three days), and on 2026-08-28 the handoff
      # committed at 19:01 UTC = 3 PM ET, after the publish job had already run
      # and skipped, so the issue never went out that day.
      #
      # So: if this run itself finished past 12:30 ET, publish now instead of
      # leaving it for tomorrow. Publishing twice is not a hazard -- a later slot
      # finds is_published and skips.
      #
      # SUBSTACK_SEND_EMAIL must be set explicitly: publish.py defaults to
      # web-only (no subscriber email) when the variable is absent, which would
      # silently publish a SILENT issue.
      - name: Publish late if past 12:30 PM ET
        continue-on-error: true
        env:
          SUBSTACK_COOKIES_STRING: ${{ secrets.SUBSTACK_COOKIES_STRING }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SUBSTACK_SEND_EMAIL: 'true'
        run: |
          bash ci/run_stage.sh "Publish late if past 12:30 PM ET" <<'STAGE'
          NOW_ET=$(TZ=America/New_York date '+%H%M')
          PRETTY=$(TZ=America/New_York date '+%I:%M %p %Z')
          if [ "$((10#$NOW_ET))" -ge 1230 ]; then
            echo "This run finished at $PRETTY, past the 12:30 PM ET slot — publishing now."
            python substack_poc/publish.py --publish-existing \
              --state-in substack_post_state.json \
              --result-out publish_result.json
            echo "Ran late ($PRETTY) — published immediately rather than waiting." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Finished at $PRETTY, before 12:30 PM ET — leaving it to publish-substack.yml."
            echo "Draft created at $PRETTY; publish-substack.yml will post it at 12:30 PM ET." >> "$GITHUB_STEP_SUMMARY"
          fi
          STAGE

      # Reads what the run actually produced (tweets, GIFs, memes, un-rendered
      # placeholders, whether any pass came back truncated) and RECORDS it, so
      # the status email can quote the findings. --record always exits 0: a
      # broken issue must not stop the email that explains it. The exit code
      # comes from the gate at the very bottom instead.
      #
      # Verified against the archive: these findings fail 2026-09-01, the day
      # seven GIFs shipped as invisible empty divs, and pass the five issues
      # around it with warnings only.
      - name: Assess run quality
        if: always()
        continue-on-error: true
        run: bash ci/run_stage.sh "Assess run quality" python verify_run.py --record

      # THE one email (SLA-52). always(), and last, because the run Abram most
      # needs to hear about is the run that died on step three — and that is
      # exactly the run the old mid-workflow email step never reached. It
      # carries the status panel, what broke and why, the cost breakdown, the
      # Substack draft handoff, and then the newsletter itself with the box
      # score images inline.
      #
      # continue-on-error so a failed SEND (it exits non-zero) still reaches the
      # gate below, which turns it into a red run.
      - name: Send the daily status email
        if: always()
        continue-on-error: true
        run: |
          FLAGS=""
          if [ "${{ inputs.rerun_of_failed_run }}" = "true" ]; then
            FLAGS="--rerun-safe"
          fi
          python email_newsletter.py $FLAGS

      # SLA-56 dead man's switch, second half. Right after the email, because
      # the question it answers is "did Abram hear from this run?". Email sent
      # -> success ping (the email already carries the verdict; a second alert
      # for the same failure is noise). Email NOT sent -> fail ping, and the
      # service alerts at once: this is the only channel left. always() so it
      # runs after a failed stage; a job killed before reaching it simply never
      # finishes, and the service alerts at the cutoff instead.
      - name: Heartbeat — finished
        if: always()
        continue-on-error: true
        env:
          SLAP_HEARTBEAT_URL: ${{ secrets.SLAP_HEARTBEAT_URL }}
        run: python heartbeat.py finish

      # SLA-55: persist proof that today's email went out, so a LATER rerun on
      # a fresh runner (run_status.json is gitignored and reset every run — it
      # cannot answer this) can tell and skip sending a duplicate. Mirrors the
      # substack_post_state.json handoff. continue-on-error and always(): a
      # push hiccup here must not cost the run-quality gate below, and this
      # must still attempt even after an earlier critical failure so a rerun
      # after THAT failure has something to check.
      - name: Commit email-sent marker
        if: always()
        continue-on-error: true
        run: |
          bash ci/run_stage.sh "Commit email-sent marker" <<'STAGE'
          if [ -f email_sent_state.json ]; then
            git config user.name "SLAP Bot"
            git config user.email "slap-bot@users.noreply.github.com"
            git add email_sent_state.json
            git commit -m "Email-sent marker for $(date -u +%Y-%m-%d)" || echo "No marker change to commit"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "No email_sent_state.json to commit (send failed or was skipped)."
          fi
          STAGE

      # The job's verdict, computed from the same findings the email just
      # reported — including whether that email actually sent.
      - name: Run-quality gate
        if: always()
        run: python verify_run.py --gate
