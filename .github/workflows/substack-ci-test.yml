name: Substack CI Test

# Manual-only. Tests whether GitHub Actions can reach Substack's API (or gets
# Cloudflare-blocked). Creates and immediately deletes a throwaway draft.
# Does NOT run on a schedule and never publishes anything.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUBSTACK_COOKIES_STRING: ${{ secrets.SUBSTACK_COOKIES_STRING }}
      SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
      PROXY_URL: ${{ secrets.PROXY_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install python-substack==0.1.22 curl_cffi

      - name: Run Substack connectivity test
        run: python substack_poc/ci_auth_test.py
