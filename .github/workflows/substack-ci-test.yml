name: Substack CI Test

# Manual-only. Two modes, selected by the `mode` input:
#
#   connectivity (default) - tests whether GitHub Actions can reach Substack's
#     API (or gets Cloudflare-blocked). Creates and immediately deletes a
#     throwaway draft.
#
#   table-probe - SLA-17. Sends a draft containing a native ProseMirror table
#     node and reads it back to see whether Substack kept or stripped it.
#     Leaves the draft in place for inspection unless `delete_draft` is true.
#
# Neither mode ever publishes anything.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which test to run'
        required: true
        default: 'connectivity'
        type: choice
        options:
          - connectivity
          - table-probe
          - text-preview
          - datawrapper-probe
          - dark-mode-test
          - cleanup
          - delete-draft
      delete_draft:
        description: 'table-probe only: delete the draft after reading it back'
        required: false
        default: false
        type: boolean
      delete_draft_id:
        description: 'delete-draft mode: the draft id to delete'
        required: false
        default: ''
        type: string
      cleanup_drafts:
        description: 'cleanup mode: comma-separated Substack draft ids'
        required: false
        default: ''
        type: string
      cleanup_charts:
        description: 'cleanup mode: comma-separated Datawrapper chart ids'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
      SUBSTACK_COOKIES_STRING: ${{ secrets.SUBSTACK_COOKIES_STRING }}
      SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
      PROXY_URL: ${{ secrets.PROXY_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install python-substack==0.1.22 curl_cffi

      - name: Run Substack connectivity test
        if: inputs.mode == 'connectivity'
        run: python substack_poc/ci_auth_test.py

      - name: Run native-table probe (SLA-17)
        if: inputs.mode == 'table-probe'
        run: |
          python substack_poc/table_probe.py \
            --game-state uat/fixtures/game_state.json \
            ${{ inputs.delete_draft && '--delete' || '' }}

      # SLA-17: real box scores as code_block text, for a visual check on a
      # phone and in dark mode. The offline suite proves the character counts;
      # only a real draft shows what Substack's renderer does with them.
      - name: Draft box scores as text (SLA-17)
        if: inputs.mode == 'text-preview'
        run: |
          python substack_poc/text_box_preview.py \
            --game-state uat/fixtures/game_state.json \
            --sports mlb --games 3 \
            --title "[SLA-17] Box scores as text — ${GITHUB_SHA::7}"

      # SLA-17 go/no-go: build a real Datawrapper table, then try every
      # candidate Substack embed node -- ONE DRAFT EACH, so a node that
      # crashes the editor (as `table` did) costs one draft, not the run.
      - name: Datawrapper embed probe (SLA-17)
        if: inputs.mode == 'datawrapper-probe'
        run: |
          python substack_poc/datawrapper_probe.py \
            --game-state uat/fixtures/game_state.json

      # SLA-17: the `datawrapper` node renders, but came back dark on a light
      # page. Same table, three dark settings, one draft -- whatever the
      # browser is doing it does to all three, so the match is the answer.
      - name: Datawrapper dark-mode test (SLA-17)
        if: inputs.mode == 'dark-mode-test'
        run: |
          python substack_poc/datawrapper_darkmode.py \
            --game-state uat/fixtures/game_state.json

      # Sweep up the probe artifacts. Deletion is irreversible, so the script
      # prints what it will remove and treats an already-gone item as success.
      - name: Delete probe artifacts (SLA-17)
        if: inputs.mode == 'cleanup'
        run: |
          python substack_poc/cleanup_probe_artifacts.py \
            --drafts "${{ inputs.cleanup_drafts }}" \
            --charts "${{ inputs.cleanup_charts }}"

      # A draft carrying a table node crashes the Substack editor, so it cannot
      # be deleted through the UI. This removes one by id via the API.
      - name: Delete a draft by id
        if: inputs.mode == 'delete-draft'
        run: |
          test -n "${{ inputs.delete_draft_id }}" || { echo "delete_draft_id is required"; exit 1; }
          python substack_poc/table_probe.py --delete-id "${{ inputs.delete_draft_id }}"
